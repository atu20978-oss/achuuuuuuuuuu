<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For you ♥</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--t:#e8836f;--m:#d96a8a;--b:#f2a07a;--scr:"Pinyon Script","Snell Roundhand",cursive;--ser:"Cormorant Garamond",Georgia,serif;box-sizing:border-box}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font:17px/1.6 Inter,system-ui,sans-serif;color:#fff;text-shadow:0 2px 22px rgba(70,20,55,.35);overflow-x:hidden;-webkit-font-smoothing:antialiased}
.sky{position:fixed;inset:0;background:linear-gradient(var(--t),var(--m) 55%,var(--b));z-index:0}
#sun{position:fixed;left:50%;bottom:20vh;width:min(46vw,380px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#fff6d8 0,#ffd98a 35%,rgba(255,170,110,.5) 60%,transparent 72%);transform:translateX(-50%);z-index:1;will-change:transform,opacity;filter:blur(1px)}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
.hills{position:fixed;left:0;right:0;bottom:0;height:30vh;width:100%;z-index:3;pointer-events:none}
.br{position:fixed;top:0;width:min(62vw,640px);z-index:4;pointer-events:none;transform-origin:0 0;animation:sway 7s ease-in-out infinite}
.br.l{left:0}.br.r{right:0;transform:scaleX(-1);animation-name:swayr}
.bl{transform-origin:center;animation:bloom 4s ease-in-out infinite;animation-delay:var(--d)}
.rail{position:fixed;right:22px;top:18vh;bottom:18vh;width:1px;background:rgba(255,255,255,.3);z-index:20}
.rail i{position:absolute;left:50%;top:0;font-style:normal;font-size:16px;transform:translate(-50%,-50%);animation:beat 1.4s infinite}
main{position:relative;z-index:10}
.sc{min-height:100vh;display:flex;align-items:center;padding:12vh 7vw}
.sc.c{flex-direction:column;justify-content:center;text-align:center}
.ey{font:500 12px Inter;letter-spacing:.3em;text-transform:uppercase;opacity:.85;margin-bottom:22px}
.script{font:400 clamp(72px,17vw,200px)/.95 var(--scr);letter-spacing:-.01em}
.ln{display:block;overflow:hidden;padding:.12em .1em .18em}
.ln>span{display:block;transform:translateY(115%) rotate(4deg);transition:transform 1.4s cubic-bezier(.2,.9,.2,1);transition-delay:calc(var(--i,0)*.18s + .2s)}
.sc.in .ln>span{transform:none}
.fd{opacity:0;transform:translateY(26px);transition:opacity 1.1s .8s,transform 1.1s .8s}
.sc.in .fd{opacity:1;transform:none}
.sub{font:italic 500 clamp(20px,2.6vw,28px) var(--ser);max-width:26em}
.cue{margin-top:46px;font-size:26px;animation:bob 2s ease-in-out infinite}
h2{font:italic 600 clamp(34px,5.4vw,64px)/1.05 var(--ser);margin:6px 0 14px}
.card{width:min(540px,100%);padding:44px 40px;border-radius:30px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.38);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 30px 80px -30px rgba(80,20,60,.5);opacity:0;transform:translateY(80px) rotate(var(--r)) scale(.94);transition:opacity 1.2s,transform 1.4s cubic-bezier(.2,.9,.2,1)}
.sc.in .card{opacity:1;transform:rotate(var(--r))}
.sc.in .card:hover{transform:rotate(0) translateY(-6px)}
.sc:nth-child(odd) .card{margin-left:auto}
.num{font:400 64px/1 var(--scr);display:block;margin-bottom:6px}
.card p{font:italic 500 21px/1.5 var(--ser)}
.rs{display:grid;gap:14px}
.r{font:italic 600 clamp(30px,5vw,58px)/1.1 var(--ser);opacity:0;transform:translateX(-40px) skewX(-6deg);filter:blur(8px);transition:all 1.1s calc(var(--i)*.35s + .3s) cubic-bezier(.2,.9,.2,1)}
.sc.in .r{opacity:1;transform:none;filter:none}
.big{font:400 clamp(54px,10vw,130px)/1 var(--scr);margin:10px 0 18px}
.btns{margin-top:44px;display:flex;gap:26px;justify-content:center;align-items:center;min-height:90px}
button{font:600 20px Inter,sans-serif;border:0;border-radius:999px;cursor:pointer;color:#fff;text-shadow:none}
#yes{padding:20px 54px;background:linear-gradient(135deg,#ff4f86,#ff8fa3);box-shadow:0 12px 50px rgba(255,79,134,.65),0 0 0 6px rgba(255,255,255,.18);transform:scale(var(--s,1));animation:pulse 1.6s ease-in-out infinite;position:relative;z-index:2}
#no{padding:16px 34px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.55);backdrop-filter:blur(8px);font-size:17px;transition:left .38s cubic-bezier(.3,1.6,.5,1),top .38s cubic-bezier(.3,1.6,.5,1);z-index:60;white-space:nowrap}
#win{position:fixed;inset:0;z-index:100;display:grid;place-items:center;text-align:center;padding:7vw;background:radial-gradient(circle at 50% 40%,rgba(120,30,90,.55),rgba(35,12,50,.9));opacity:0;visibility:hidden;transition:opacity 1.2s}
#win.on{opacity:1;visibility:visible}
#win .heart{font-size:84px;animation:beat 1s infinite;display:block;margin-bottom:10px}
#win .script{font-size:clamp(64px,14vw,150px)}
#win p{font:italic 500 clamp(22px,3.4vw,36px)/1.4 var(--ser);max-width:24em;margin:12px auto 0;opacity:0;animation:up 1.2s 1.2s forwards}
#win .sig{font:400 44px var(--scr);animation-delay:2.2s}
#mu{position:fixed;top:calc(18px + env(safe-area-inset-top,0px));left:18px;z-index:30;padding:10px 18px;font-size:14px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.5);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
@keyframes sway{50%{transform:rotate(2.5deg)}}
@keyframes swayr{50%{transform:scaleX(-1) rotate(2.5deg)}}
@keyframes bloom{50%{transform:scale(1.18)}}
@keyframes bob{50%{transform:translateY(10px)}}
@keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.22)}28%{transform:scale(1)}42%{transform:scale(1.14)}}
#yes{--k:1}
@keyframes pulse{50%{transform:scale(calc(var(--s,1)*1.07))}}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@media(max-width:700px){.br{width:90vw}.rail{display:none}.sc{padding:12vh 6vw}.card{padding:34px 28px}.btns{flex-direction:column}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div class="sky"></div><div id="sun"></div><canvas id="fx"></canvas>
<svg class="hills" viewBox="0 0 1000 300" preserveAspectRatio="none"><path d="M0 150C150 70 300 110 450 140S750 60 1000 130V300H0Z" fill="rgba(110,40,95,.55)"/><path d="M0 220C200 150 350 230 560 190S850 150 1000 210V300H0Z" fill="rgba(50,18,55,.92)"/></svg>
<svg class="br l" viewBox="0 0 600 420" id="bl"></svg><svg class="br r" viewBox="0 0 600 420" id="br"></svg>
<div class="rail"><i id="rh">♥</i></div>
<button id="mu">♪ Tap for music</button>
<main id="m"></main>
<div id="win"><div><span class="heart">💖</span><h2 class="script" id="wt"></h2><p id="wm"></p><p class="sig" id="ws"></p></div></div>

<script>
/* ======== EDIT YOUR STORY HERE ======== */
const C={
 her:"Arya",
 nick:"Achu",
 me:"Ananthu S",
 date:"",   // e.g. "26 October 2026"
 q:"Will you be my girlfriend again?",
 sub:"Like the first time, only now I know exactly what I’m asking for.",
 intro:"I made something for you, Achu. Scroll slowly.",
 memories:[
  ["Sangeetham Wetland","The place where we first met. A normal day that quietly became one of my favourites."],
  ["Amazon View Point","Hiking up to the view point in Malappuram, tired and laughing, with the whole sky in front of us."],
  ["The first time I asked","The day I nervously asked you to be my girlfriend. My heart has not forgotten it."],
  ["Your birthday","Nothing grand. Some photos and some flowers, made with all my heart just for you."]],
 reasons:["Your eyes","Your voice","Everything about you"],
 thanks:"You just made me the happiest person alive."
};
/* ====================================== */
const $=s=>document.querySelector(s),rnd=(a,b)=>a+Math.random()*(b-a),reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
const ln=(t,i)=>`<span class="ln"><span style="--i:${i}">${t}</span></span>`;
$("#m").innerHTML=
`<section class="sc c"><p class="ey fd">for you</p><h1 class="script">${ln("Hey,",0)}${ln(C.her,1)}</h1><p class="sub fd">${C.intro}</p><div class="cue fd">↓</div></section>`+
C.memories.map((m,i)=>`<section class="sc"><div class="card" style="--r:${i%2?2.5:-2.5}deg"><span class="num">0${i+1}</span><h2>${m[0]}</h2><p>${m[1]}</p></div></section>`).join("")+
`<section class="sc c"><p class="ey fd">what I love about you</p><div class="rs">${C.reasons.map((r,i)=>`<div class="r" style="--i:${i}">${r}</div>`).join("")}</div></section>`+
`<section class="sc c" id="ask"><p class="ey fd">so, ${C.nick}…</p><h2 class="big">${ln(C.q,0)}</h2><p class="sub fd">${C.sub}</p><div class="btns fd"><button id="yes">Yes 💖</button><button id="no">No</button></div></section>`;
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add("in")}),{threshold:.3});
document.querySelectorAll(".sc").forEach(s=>io.observe(s));

/* blossom branches */
function branch(id,d){const s=$(id);s.innerHTML=`<path id="${id.slice(1)}p" d="${d}" stroke="#4a2536" stroke-width="7" fill="none" stroke-linecap="round"/>`;const p=s.firstChild,L=p.getTotalLength();
 for(let i=1;i<=22;i++){const pt=p.getPointAtLength(L*i/22),x=pt.x+rnd(-26,26),y=pt.y+rnd(-26,26),sc=rnd(.8,1.5);
  s.insertAdjacentHTML("beforeend",`<g transform="translate(${x} ${y}) scale(${sc})"><g class="bl" style="--d:${rnd(0,4).toFixed(1)}s">${[0,72,144,216,288].map(a=>`<circle cx="0" cy="-9" r="7.5" transform="rotate(${a})" fill="${i%3?"#ffc4d6":"#ffdce7"}"/>`).join("")}<circle r="3.4" fill="#ffe08a"/></g></g>`)}}
branch("#bl","M-10 30C130 70 230 40 330 150S480 280 580 260");
branch("#br","M-10 10C110 40 250 20 340 110S500 200 600 170");

/* palette */
const hx=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16)),mix=(a,b,t)=>`rgb(${hx(a).map((v,i)=>Math.round(v+(hx(b)[i]-v)*t)).join(",")})`;
const P=[["#e8836f","#d96a8a","#f2a07a"],["#8a4a9a","#e0759a","#f6a97a"],["#15123a","#4b2a6b","#c2587a"]];
function pal(sp){const i=sp<.55?0:1,t=i?(sp-.55)/.45:sp/.55;return P[i].map((c,k)=>mix(c,P[i+1][k],t))}

/* canvas: petals, stars, bursts */
const cv=$("#fx"),g=cv.getContext("2d");let W,H,D;
function size(){D=Math.min(devicePixelRatio||1,2);cv.width=innerWidth*D;cv.height=innerHeight*D;g.setTransform(D,0,0,D,0,0);W=innerWidth;H=innerHeight}
size();addEventListener("resize",size);
const cols=["#ffd1dc","#ffb7c9","#ffe4ec","#ff9fb8","#fff"];
const mk=(y)=>({x:rnd(0,W),y:y??rnd(0,H),s:rnd(6,14),vy:rnd(.5,1.6),vx:rnd(-.3,.3),r:rnd(0,6.28),vr:rnd(-.03,.03),ph:rnd(0,6.28),c:cols[Math.floor(rnd(0,cols.length))]});
let petals=Array.from({length:reduce?14:W<700?38:80},()=>mk());
const stars=Array.from({length:130},()=>({x:rnd(0,1),y:rnd(0,.7),r:rnd(.4,1.6),p:rnd(0,6.28)}));
let fx=[];
function petalPath(s){g.beginPath();g.moveTo(0,-s);g.bezierCurveTo(s*.9,-s*.6,s*.7,s*.7,0,s);g.bezierCurveTo(-s*.7,s*.7,-s*.9,-s*.6,0,-s);g.fill()}
function heartPath(s){g.beginPath();g.moveTo(0,s*.9);g.bezierCurveTo(-s*1.4,-s*.1,-s*.5,-s*1.1,0,-s*.4);g.bezierCurveTo(s*.5,-s*1.1,s*1.4,-s*.1,0,s*.9);g.fill()}
function burst(n,x,y,power){for(let i=0;i<n;i++){const a=rnd(0,6.283),v=rnd(2,power);fx.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-power*.4,r:rnd(0,6),vr:rnd(-.2,.2),s:rnd(7,18),t:["h","p","c","h"][i%4],c:["#ff4f86","#ff8fa3","#ffd1dc","#ffe08a","#fff"][i%5],life:rnd(110,220),g:.14})}}
let mx=-999,my=-999,wind=0,lastY=scrollY,sp=0,T=0,lastSp=0;
addEventListener("pointermove",e=>{mx=e.clientX;my=e.clientY;const n=performance.now();if(n-lastSp>45&&!reduce){lastSp=n;fx.push({x:mx,y:my,vx:rnd(-.6,.6),vy:rnd(-1.2,-.2),r:rnd(0,6),vr:rnd(-.1,.1),s:rnd(4,9),t:Math.random()<.5?"h":"p",c:cols[Math.floor(rnd(0,4))],life:60,g:-.01})}});
const sun=$("#sun"),rh=$("#rh");
function frame(){T++;
 const doc=document.documentElement;sp=scrollY/(doc.scrollHeight-innerHeight||1);
 const vel=scrollY-lastY;lastY=scrollY;wind+=((reduce?0:vel*.25)-wind)*.06;
 const [a,b,c]=pal(sp),st=document.body.style;st.setProperty("--t",a);st.setProperty("--m",b);st.setProperty("--b",c);
 sun.style.transform=`translateX(-50%) translateY(${sp*46}vh) scale(${1-sp*.3})`;sun.style.opacity=Math.max(0,1-Math.max(0,sp-.55)*2.6);
 rh.style.top=sp*100+"%";
 g.clearRect(0,0,W,H);
 const sa=Math.max(0,Math.min(1,(sp-.5)/.3));
 if(sa>0){g.fillStyle="#fff";for(const s of stars){g.globalAlpha=sa*(.35+.65*Math.abs(Math.sin(T*.02+s.p)));g.beginPath();g.arc(s.x*W,s.y*H,s.r,0,6.283);g.fill()}}
 g.globalAlpha=.88;
 for(const p of petals){p.ph+=.02;p.y+=p.vy;p.x+=p.vx+wind*p.s/10+Math.sin(p.ph)*.7;p.r+=p.vr+wind*.01;
  const dx=p.x-mx,dy=p.y-my,d=Math.hypot(dx,dy);if(d<90){p.x+=dx/d*2.4;p.y+=dy/d*1.6}
  if(p.y>H+20){Object.assign(p,mk(-20))}if(p.x>W+20)p.x=-20;if(p.x<-20)p.x=W+20;
  g.save();g.translate(p.x,p.y);g.rotate(p.r);g.scale(1,Math.abs(Math.cos(p.ph*.6))*.6+.4);g.fillStyle=p.c;petalPath(p.s);g.restore()}
 for(let i=fx.length-1;i>=0;i--){const f=fx[i];f.life--;f.vy+=f.g;f.vx*=.992;f.x+=f.vx;f.y+=f.vy;f.r+=f.vr;if(f.life<=0||f.y>H+40){fx.splice(i,1);continue}
  g.globalAlpha=Math.min(1,f.life/30);g.save();g.translate(f.x,f.y);g.rotate(f.r);g.fillStyle=f.c;
  if(f.t==="h")heartPath(f.s);else if(f.t==="p")petalPath(f.s*.8);else g.fillRect(-f.s/2,-f.s/4,f.s,f.s/2);g.restore()}
 g.globalAlpha=1;requestAnimationFrame(frame)}
frame();

/* running NO button */
const no=$("#no"),yes=$("#yes"),ask=$("#ask");let moved=false,dodges=0,spacer=null,askIn=false;
const msgs=["No","Are you sure?","Nice try 😌","Think again…","Too slow!","Really? 🥺","Just say yes 💖","Pretty please?"];
function dodge(px,py){
 if(!moved){moved=true;const r=no.getBoundingClientRect();spacer=document.createElement("span");spacer.style.cssText=`width:${r.width}px;height:${r.height}px`;no.after(spacer);no.style.position="fixed";no.style.left=r.left+"px";no.style.top=r.top+"px"}
 const r=no.getBoundingClientRect(),w=r.width,h=r.height,cx=r.left+w/2,cy=r.top+h/2;let dx=cx-px,dy=cy-py;const d=Math.hypot(dx,dy)||1;dx/=d;dy/=d;
 const m=14,mxX=innerWidth-w-m,mxY=innerHeight-h-m;let nx=cx+dx*rnd(190,300)-w/2,ny=cy+dy*rnd(190,300)-h/2;
 if(nx<m||nx>mxX||ny<m||ny>mxY){for(let i=0;i<10;i++){nx=rnd(m,mxX);ny=rnd(m,mxY);if(Math.hypot(nx+w/2-px,ny+h/2-py)>220)break}}
 no.style.left=Math.max(m,Math.min(mxX,nx))+"px";no.style.top=Math.max(m,Math.min(mxY,ny))+"px";
 dodges++;no.textContent=msgs[dodges%msgs.length];yes.style.setProperty("--s",Math.min(1.9,1+dodges*.07))}
function near(px,py,r){const b=no.getBoundingClientRect();return Math.hypot(px-(b.left+b.width/2),py-(b.top+b.height/2))<r+b.width/2}
addEventListener("pointermove",e=>{if(askIn&&near(e.clientX,e.clientY,70))dodge(e.clientX,e.clientY)});
addEventListener("pointerdown",e=>{if(askIn&&near(e.clientX,e.clientY,50)){e.preventDefault();dodge(e.clientX,e.clientY)}});
no.addEventListener("click",e=>{e.preventDefault();dodge(e.clientX||innerWidth/2,e.clientY||innerHeight/2)});
no.addEventListener("focus",()=>{const b=yes.getBoundingClientRect();dodge(b.left+b.width/2,b.top+b.height/2)});
new IntersectionObserver(es=>es.forEach(e=>{askIn=e.isIntersecting;no.style.visibility=askIn||!moved?"visible":"hidden";
 if(!askIn&&moved){moved=false;dodges=0;no.style.cssText="";no.textContent="No";spacer&&spacer.remove();yes.style.setProperty("--s",1)}}),{threshold:.25}).observe(ask);

/* YES */
function chime(){try{const A=new (window.AudioContext||window.webkitAudioContext)();[523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>{const o=A.createOscillator(),v=A.createGain();o.type="sine";o.frequency.value=f;o.connect(v);v.connect(A.destination);const t=A.currentTime+i*.16;v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(.14,t+.03);v.gain.exponentialRampToValueAtTime(.001,t+1.4);o.start(t);o.stop(t+1.5)})}catch(e){}}
yes.addEventListener("click",()=>{
 document.body.style.overflow="hidden";$("#wt").textContent="Thank you, "+C.nick;$("#wm").textContent=C.thanks;$("#ws").textContent="— "+C.me+(C.date?" · "+C.date:"");
 $("#win").classList.add("on");chime();
 [0,350,800,1400].forEach(d=>setTimeout(()=>burst(120,rnd(W*.25,W*.75),rnd(H*.3,H*.6),16),d));
 setInterval(()=>{const x=rnd(0,W);fx.push({x,y:-20,vx:rnd(-.8,.8),vy:rnd(1.5,3.5),r:rnd(0,6),vr:rnd(-.05,.05),s:rnd(8,20),t:Math.random()<.65?"h":"p",c:["#ff4f86","#ff8fa3","#ffd1dc","#fff"][Math.floor(rnd(0,4))],life:420,g:0})},110)});

/* gentle generated music */
let AC,MG,on=false;const CH=[[261.63,329.63,392,523.25],[196,246.94,293.66,392],[220,261.63,329.63,440],[174.61,220,261.63,349.23]],BS=[130.81,98,110,87.31],PE=[523.25,587.33,659.25,783.99,880,1046.5];
function note(f,t,d,ty,v){const o=AC.createOscillator(),g2=AC.createGain();o.type=ty;o.frequency.value=f;o.connect(g2);g2.connect(MG);g2.gain.setValueAtTime(0,t);g2.gain.linearRampToValueAtTime(v,t+.02);g2.gain.exponentialRampToValueAtTime(.0008,t+d);o.start(t);o.stop(t+d+.05)}
function startMusic(){if(AC){AC.resume();return}
 AC=new (window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=0;const dl=AC.createDelay(),fb=AC.createGain();dl.delayTime.value=.42;fb.gain.value=.38;MG.connect(AC.destination);MG.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(AC.destination);
 MG.gain.linearRampToValueAtTime(.55,AC.currentTime+3);let step=0,nx=AC.currentTime+.1;const sd=60/72/2;
 setInterval(()=>{while(nx<AC.currentTime+.6){const bar=Math.floor(step/8)%4,i=step%8,ch=CH[bar];if(i===0)note(BS[bar],nx,2.6,"triangle",.2);note(ch[[0,1,2,3,2,1,2,3][i]],nx,1.4,"sine",.11);if(i%4===2&&Math.random()<.55)note(PE[Math.floor(Math.random()*PE.length)],nx,2,"sine",.07);nx+=sd;step++}},120)}
const mu=$("#mu");
function setMu(){mu.textContent=on?"♪ Music on":"♪ Music off"}
mu.addEventListener("click",()=>{if(!AC){startMusic();on=true}else{on=!on;MG.gain.cancelScheduledValues(AC.currentTime);MG.gain.linearRampToValueAtTime(on?.55:0,AC.currentTime+.6);AC.resume()}setMu()});
["pointerdown","keydown","touchend"].forEach(ev=>addEventListener(ev,e=>{if(!AC&&e.target.id!=="mu"){startMusic();on=true;setMu()}},{once:false,passive:true}));
</script>
</body>
</html>
